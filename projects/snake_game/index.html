<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a22">
  <title>Snake — 20 levels</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CLASSIC ARCADE</p>
        <h1>Snake<span>.</span></h1>
      </div>
      <div class="status-pill"><span class="status-dot"></span><span id="status">Ready to play</span></div>
    </header>
    <section class="stats" aria-label="Game progress">
      <div class="stat-card"><span class="stat-label">LEVEL</span><strong id="level">01 <small>/ 20</small></strong></div>
      <div class="stat-card"><span class="stat-label">SCORE</span><strong id="score">000</strong></div>
      <div class="stat-card"><span class="stat-label">FRUITS</span><strong id="fruit-count">0 <small>/ 4</small></strong></div>
    </section>
    <div class="board-wrap">
      <canvas id="board" width="600" height="400" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <div class="overlay-icon" id="overlay-icon">↗</div>
          <h2 id="overlay-title">Ready to play?</h2>
          <p id="overlay-copy">Eat 4 fruits to clear a level. Beat all 20!</p>
          <button id="start-button" class="primary-button">Start game</button>
        </div>
      </div>
    </div>
    <footer class="controls">
      <div class="keys-help"><span class="key">↑</span><span class="key">←</span><span class="key">↓</span><span class="key">→</span><span class="help-text">Move the snake</span></div>
      <div class="control-hint"><span class="key key-wide">SPACE</span><span class="help-text">Pause</span><span class="separator">·</span><span class="help-text">Avoid the walls and your tail</span></div>
    </footer>
    <div class="mobile-controls" aria-label="Touch controls">
      <button data-direction="up" aria-label="Up">↑</button>
      <div><button data-direction="left" aria-label="Left">←</button><button data-direction="down" aria-label="Down">↓</button><button data-direction="right" aria-label="Right">→</button></div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
